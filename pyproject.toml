# pyproject.toml

[project]
authors = [{ name = "Guillermo Gil", email = "guillegil@proton.me" }]
description = "Pytest Report"
version = "0.1.0"
license = "MIT"
name = "pytest_report"
readme = "README.md"
requires-python = ">=3.9"
urls = { homepage = "https://mypluginurl.com", repository = "https://github.com/guillegil/pytest-report" }
dependencies = [
    "pytest>=7",
    "advancedlogger @ git+https://github.com/guillegil/advanced-logger@develop",
    "pytest-meta @ git+https://github.com/guillegil/pytest-meta@develop",
    "pytest-checker @ git+https://github.com/guillegil/pytest_checker@develop",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project.entry-points."pytest11"]
pytest_report = "pytest_report.plugin"


[tool.setuptools.packages.find]
where = ["src"]
include = ["pytest_report*"]

[tool.setuptools.package-data]
pytest_report = ["jinja/**/*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::pytest.PytestUnknownMarkWarning"]

[project.optional-dependencies]
dev = [
    "pytest",
    "advancedlogger @ git+https://github.com/guillegil/advanced-logger@develop",
    "pytest-meta @ git+https://github.com/guillegil/pytest-meta@develop",
    "pytest-checker @ git+https://github.com/guillegil/pytest_checker@develop",
]
